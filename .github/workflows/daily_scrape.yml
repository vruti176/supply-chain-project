name: Daily Supply Chain Scrape

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install requests pandas python-dotenv sqlalchemy

      - name: Run the pipeline
        run: python main.py

      - name: Save database file
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-db
          path: supply_chain.db
